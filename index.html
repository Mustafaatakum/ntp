<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C# Uygulamaları — NTP</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141418;
    --surface2: #1c1c22;
    --border: #2a2a35;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --accent-glow: rgba(124,58,237,0.25);
    --text: #e8e8f0;
    --text-muted: #6b6b80;
    --text-dim: #9999b0;
    --green: #22c55e;
    --blue: #3b82f6;
    --orange: #f97316;
    --red: #ef4444;
    --yellow: #eab308;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, var(--accent-glow) 0%, transparent 60%);
    pointer-events: none;
  }
  .logo {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    color: white;
    flex-shrink: 0;
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .header-text h1 {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  .header-text p {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 1px;
  }
  .header-search {
    margin-left: auto;
    position: relative;
  }
  .header-search input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px 7px 34px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    outline: none;
    width: 220px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .header-search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .header-search input::placeholder { color: var(--text-muted); }
  .search-icon {
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13px;
  }
  .gh-link {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    color: var(--text-dim);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    transition: all 0.2s;
  }
  .gh-link:hover { border-color: var(--accent2); color: var(--text); }

  /* MAIN LAYOUT */
  .main {
    display: grid;
    grid-template-columns: 300px 1fr;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .sidebar-header span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .count-badge {
    background: var(--accent);
    color: white;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 600;
  }
  .tree {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }
  .tree::-webkit-scrollbar { width: 4px; }
  .tree::-webkit-scrollbar-track { background: transparent; }
  .tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .unit-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    position: relative;
  }
  .unit-header:hover { background: var(--surface2); }
  .unit-header.open .chevron { transform: rotate(90deg); }
  .chevron {
    color: var(--text-muted);
    font-size: 10px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .unit-dot {
    width: 8px; height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .unit-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    flex: 1;
    line-height: 1.3;
  }
  .unit-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
  }

  .apps-list {
    display: none;
    padding-bottom: 4px;
  }
  .apps-list.open { display: block; }

  .app-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px 7px 36px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 2px solid transparent;
    margin-left: 0;
  }
  .app-item:hover { background: var(--surface2); }
  .app-item.active {
    background: rgba(124,58,237,0.12);
    border-left-color: var(--accent);
  }
  .app-item .app-name {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.3;
    flex: 1;
  }
  .app-item.active .app-name { color: var(--text); }
  .app-item .app-file {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* CONTENT AREA */
  .content {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  /* EMPTY STATE */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
    color: var(--text-muted);
  }
  .empty-icon {
    font-size: 48px;
    opacity: 0.3;
  }
  .empty-state h2 {
    font-size: 18px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .empty-state p {
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    line-height: 1.6;
  }

  /* APP DETAIL */
  .app-detail {
    display: none;
    flex-direction: column;
    flex: 1;
    overflow-y: auto;
    padding: 32px 36px;
  }
  .app-detail.visible { display: flex; }
  .app-detail::-webkit-scrollbar { width: 4px; }
  .app-detail::-webkit-scrollbar-thumb { background: var(--border); }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }
  .breadcrumb span { color: var(--text-muted); }
  .breadcrumb .sep { color: var(--border); }
  .breadcrumb .current { color: var(--accent2); }

  .app-title-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 12px;
  }
  .app-title-icon {
    width: 52px; height: 52px;
    background: var(--accent);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 0 30px var(--accent-glow);
  }
  .app-title h2 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .app-title .file-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
  }
  .unit-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 28px;
  }
  .unit-chip-dot { width: 6px; height: 6px; border-radius: 50%; }

  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .buttons-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 32px;
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .action-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .action-btn:hover::before { opacity: 1; }

  .btn-run::before { background: radial-gradient(circle at top left, rgba(34,197,94,0.1), transparent 70%); }
  .btn-run:hover { border-color: var(--green); }
  .btn-question::before { background: radial-gradient(circle at top left, rgba(59,130,246,0.1), transparent 70%); }
  .btn-question:hover { border-color: var(--blue); }
  .btn-pdf::before { background: radial-gradient(circle at top left, rgba(239,68,68,0.1), transparent 70%); }
  .btn-pdf:hover { border-color: var(--red); }
  .btn-docx::before { background: radial-gradient(circle at top left, rgba(59,130,246,0.1), transparent 70%); }
  .btn-docx:hover { border-color: var(--blue); }
  .btn-rar::before { background: radial-gradient(circle at top left, rgba(249,115,22,0.1), transparent 70%); }
  .btn-rar:hover { border-color: var(--orange); }

  .btn-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .btn-run .btn-icon { background: rgba(34,197,94,0.15); }
  .btn-question .btn-icon { background: rgba(59,130,246,0.15); }
  .btn-pdf .btn-icon { background: rgba(239,68,68,0.15); }
  .btn-docx .btn-icon { background: rgba(59,130,246,0.15); }
  .btn-rar .btn-icon { background: rgba(249,115,22,0.15); }

  .btn-info .btn-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }
  .btn-info .btn-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .btn-ext {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
    align-self: flex-start;
  }
  .btn-run .btn-ext { background: rgba(34,197,94,0.15); color: var(--green); }
  .btn-question .btn-ext { background: rgba(59,130,246,0.15); color: var(--blue); }
  .btn-pdf .btn-ext { background: rgba(239,68,68,0.15); color: var(--red); }
  .btn-docx .btn-ext { background: rgba(59,130,246,0.15); color: var(--blue); }
  .btn-rar .btn-ext { background: rgba(249,115,22,0.15); color: var(--orange); }

  .url-preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .url-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .url-row:last-child { border-bottom: none; }
  .url-ext {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    width: 42px;
    flex-shrink: 0;
  }
  .url-path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .url-copy {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 8px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .url-copy:hover { border-color: var(--accent); color: var(--accent2); }

  /* Search results */
  .search-results {
    display: none;
    flex-direction: column;
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
  }
  .search-results.visible { display: flex; }
  .search-result-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    margin-bottom: 8px;
    transition: all 0.15s;
  }
  .search-result-item:hover { border-color: var(--accent); background: rgba(124,58,237,0.06); }
  .sr-unit { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .sr-name { font-size: 13px; font-weight: 600; }
  .sr-file { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent2); }

  /* Scrollbar */
  .app-detail::-webkit-scrollbar { width: 4px; }
  .search-results::-webkit-scrollbar { width: 4px; }
  .search-results::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>

    <div class="search-results" id="searchResults"></div>

    <div class="app-detail" id="appDetail"></div>

</div>

// ===================== RENDER TREE =====================
let selectedApp = null;
let openUnits = new Set();

function getUrl(file, ext) {
  return GITHUB_BASE + file + "." + ext;
}

function renderTree() {
  const tree = document.getElementById('tree');
  let totalApps = 0;
  UNITS.forEach(u => totalApps += u.apps.length);
  document.getElementById('totalCount').textContent = totalApps;

  tree.innerHTML = UNITS.map((unit, ui) => {
    const isOpen = openUnits.has(ui);
    return `
      <div>
        <div class="unit-header ${isOpen ? 'open' : ''}" onclick="toggleUnit(${ui})">
          <span class="chevron">▶</span>
          <span class="unit-dot" style="background:${unit.color}"></span>
          <span class="unit-label">${unit.name}</span>
          <span class="unit-count">${unit.apps.length}</span>
        </div>
        <div class="apps-list ${isOpen ? 'open' : ''}" id="unit-${ui}">
          ${unit.apps.map((app, ai) => `
            <div class="app-item ${selectedApp && selectedApp.ui === ui && selectedApp.ai === ai ? 'active' : ''}"
                 onclick="selectApp(${ui}, ${ai})">
              <span class="app-name">${app.name}</span>
              <span class="app-file">${app.file}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function toggleUnit(ui) {
  if (openUnits.has(ui)) openUnits.delete(ui);
  else openUnits.add(ui);
  renderTree();
}

function selectApp(ui, ai) {
  selectedApp = { ui, ai };
  openUnits.add(ui);
  document.getElementById('searchInput').value = '';
  showDetail();
  renderTree();
}

function showDetail() {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('searchResults').classList.remove('visible');
  document.getElementById('appDetail').classList.add('visible');

  const unit = UNITS[selectedApp.ui];
  const app = unit.apps[selectedApp.ai];
  const file = app.file;

  const files = [
    { ext: 'exe', label: 'Programı Çalıştır', sub: '.exe — çalışır dosya', cls: 'btn-run', icon: '▶️', extColor: 'green' },
    { ext: 'pdf', label: 'Kodları Görüntüle', sub: '.pdf — kaynak kodlar', cls: 'btn-pdf', icon: '📄', extColor: 'red' },
    { ext: 'docx', label: 'Kodları İndir', sub: '.docx — Word belgesi', cls: 'btn-docx', icon: '📝', extColor: 'blue' },
    { ext: 'rar', label: 'Projeyi İndir', sub: '.rar — .cs .sln .csproj', cls: 'btn-rar', icon: '📦', extColor: 'orange' },
    { ext: 'txt', label: 'Soruyu Gör', sub: '.txt — soru dosyası', cls: 'btn-question', icon: '❓', extColor: 'blue' },
  ];

  const detail = document.getElementById('appDetail');
  detail.innerHTML = `
    <div class="breadcrumb">
      <span>NTP</span>
      <span class="sep">/</span>
      <span>${unit.name}</span>
      <span class="sep">/</span>
      <span class="current">${app.name}</span>
    </div>

    <div class="app-title-row">
      <div class="app-title-icon" style="background:${unit.color}">${unit.icon}</div>
      <div class="app-title">
        <h2>${app.name}</h2>
        <div class="file-tag">📁 ${file}</div>
      </div>
    </div>

    <div class="unit-chip" style="background:${unit.color}22; border:1px solid ${unit.color}44; color:${unit.color}">
      <span class="unit-chip-dot" style="background:${unit.color}"></span>
      ${unit.name}
    </div>

    <div class="section-title">DOSYALARA ERİŞ</div>
    <div class="buttons-grid">
      ${files.map(f => `
        <a class="action-btn ${f.cls}" href="${getUrl(file, f.ext)}" target="_blank" download>
          <div class="btn-icon">${f.icon}</div>
          <div class="btn-info">
            <div class="btn-title">${f.label}</div>
            <div class="btn-sub">${f.sub}</div>
          </div>
          <span class="btn-ext">.${f.ext.toUpperCase()}</span>
        </a>
      `).join('')}
    </div>

    <div class="section-title" style="margin-top:8px">URL ÖNİZLEME</div>
    <div class="url-preview">
      ${files.map(f => `
        <div class="url-row">
          <span class="url-ext" style="color:${f.extColor === 'green' ? 'var(--green)' : f.extColor === 'red' ? 'var(--red)' : f.extColor === 'orange' ? 'var(--orange)' : 'var(--blue)'}">.${f.ext}</span>
          <span class="url-path">${getUrl(file, f.ext)}</span>
          <button class="url-copy" onclick="copyUrl('${getUrl(file, f.ext)}', this)">kopyala</button>
        </div>
      `).join('')}
    </div>
  `;
}

function copyUrl(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = '✓ kopyalandı';
    setTimeout(() => btn.textContent = 'kopyala', 1500);
  });
}

// ===================== SEARCH =====================
function handleSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) {
    document.getElementById('searchResults').classList.remove('visible');
    if (selectedApp) showDetail();
    else {
      document.getElementById('emptyState').style.display = 'flex';
      document.getElementById('appDetail').classList.remove('visible');
    }
    return;
  }
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('appDetail').classList.remove('visible');
  const sr = document.getElementById('searchResults');
  sr.classList.add('visible');

  let results = [];
  UNITS.forEach((unit, ui) => {
    unit.apps.forEach((app, ai) => {
      if (app.name.toLowerCase().includes(q) || app.file.toLowerCase().includes(q)) {
        results.push({ unit, ui, app, ai });
      }
    });
  });

  if (results.length === 0) {
    sr.innerHTML = `<div style="color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:13px;padding:40px;text-align:center;">Sonuç bulunamadı: "${q}"</div>`;
    return;
  }

  sr.innerHTML = `
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);margin-bottom:16px;">${results.length} sonuç bulundu</div>
    ${results.map(r => `
      <div class="search-result-item" onclick="selectApp(${r.ui}, ${r.ai})">
        <div class="unit-dot" style="background:${r.unit.color};width:10px;height:10px;border-radius:3px;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="sr-unit">${r.unit.name}</div>
          <div class="sr-name">${r.app.name}</div>
          <div class="sr-file">${r.app.file}</div>
        </div>
        <span style="color:var(--text-muted);font-size:18px">›</span>
      </div>
    `).join('')}
  `;
}

// ===================== INIT =====================
renderTree();
