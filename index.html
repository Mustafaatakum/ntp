<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C# Uygulamaları — NTP</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   TEMALAR
═══════════════════════════════════════════════════ */
:root {
  --bg: #0d0d0f;
  --surface: #141418;
  --surface2: #1c1c22;
  --border: #2a2a35;
  --accent: #7c3aed;
  --accent2: #a855f7;
  --accent-glow: rgba(124,58,237,0.25);
  --text: #e8e8f0;
  --text-muted: #6b6b80;
  --text-dim: #9999b0;
  --green: #22c55e;
  --blue: #3b82f6;
  --orange: #f97316;
  --red: #ef4444;
  --yellow: #eab308;
  --shadow: 0 8px 24px rgba(0,0,0,0.5);
}

[data-theme="light"] {
  --bg: #f0f0f5;
  --surface: #ffffff;
  --surface2: #e8e8f0;
  --border: #d0d0e0;
  --accent: #6d28d9;
  --accent2: #7c3aed;
  --accent-glow: rgba(109,40,217,0.15);
  --text: #1a1a2e;
  --text-muted: #6b6b80;
  --text-dim: #4a4a60;
  --green: #16a34a;
  --blue: #2563eb;
  --orange: #ea580c;
  --red: #dc2626;
  --yellow: #ca8a04;
  --shadow: 0 8px 24px rgba(0,0,0,0.12);
}

[data-theme="blue"] {
  --bg: #0a0f1e;
  --surface: #0d1628;
  --surface2: #132035;
  --border: #1e3050;
  --accent: #3b82f6;
  --accent2: #60a5fa;
  --accent-glow: rgba(59,130,246,0.25);
  --text: #e0eeff;
  --text-muted: #4a6080;
  --text-dim: #7090b0;
  --green: #34d399;
  --blue: #60a5fa;
  --orange: #fb923c;
  --red: #f87171;
  --yellow: #fbbf24;
  --shadow: 0 8px 24px rgba(0,0,0,0.6);
}

[data-theme="green"] {
  --bg: #0a1a0f;
  --surface: #0d2010;
  --surface2: #132a15;
  --border: #1e4020;
  --accent: #16a34a;
  --accent2: #22c55e;
  --accent-glow: rgba(22,163,74,0.25);
  --text: #e0ffe8;
  --text-muted: #4a6050;
  --text-dim: #70a070;
  --green: #4ade80;
  --blue: #60a5fa;
  --orange: #fb923c;
  --red: #f87171;
  --yellow: #fbbf24;
  --shadow: 0 8px 24px rgba(0,0,0,0.6);
}

[data-theme="warm"] {
  --bg: #1a1208;
  --surface: #221808;
  --surface2: #2e2010;
  --border: #483020;
  --accent: #d97706;
  --accent2: #f59e0b;
  --accent-glow: rgba(217,119,6,0.25);
  --text: #fff8e8;
  --text-muted: #806050;
  --text-dim: #b08060;
  --green: #22c55e;
  --blue: #60a5fa;
  --orange: #f59e0b;
  --red: #f87171;
  --yellow: #fbbf24;
  --shadow: 0 8px 24px rgba(0,0,0,0.6);
}

/* ═══════════════════════════════════════════════════
   GENEL STILLER
═══════════════════════════════════════════════════ */
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

/* ═══════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════ */
header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  overflow: visible;
  z-index: 100;
}
header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(90deg, var(--accent-glow) 0%, transparent 60%);
  pointer-events: none;
}
.logo {
  width: 38px; height: 38px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700; font-size: 13px; color: white;
  flex-shrink: 0;
  box-shadow: 0 0 20px var(--accent-glow);
}
.header-text h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
.header-text p { font-size: 10px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.search-wrap { position: relative; }
.search-wrap input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 12px 7px 32px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  outline: none;
  width: 200px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.search-wrap input::placeholder { color: var(--text-muted); }
.search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 12px; }

/* TEMA SEÇİCİ */
.theme-selector {
  position: relative;
}
.theme-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 12px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.theme-btn:hover { border-color: var(--accent2); color: var(--text); }

.theme-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px;
  min-width: 180px;
  box-shadow: var(--shadow);
  z-index: 999;
}
.theme-dropdown.open { display: block; }

.theme-option {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  transition: background 0.15s;
  color: var(--text-dim);
}
.theme-option:hover { background: var(--surface2); color: var(--text); }
.theme-option.active { background: var(--accent-glow); color: var(--accent2); }
.theme-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.2);
}

.gh-link {
  display: flex; align-items: center; gap: 5px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 11px;
  color: var(--text-dim);
  text-decoration: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  transition: all 0.2s;
  white-space: nowrap;
}
.gh-link:hover { border-color: var(--accent2); color: var(--text); }

/* ═══════════════════════════════════════════════════
   ANA LAYOUT
═══════════════════════════════════════════════════ */
.main { display: grid; grid-template-columns: 290px 1fr; flex: 1; overflow: hidden; }

/* ═══════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════ */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  transition: background 0.3s;
}
.sidebar-header {
  padding: 11px 15px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.sidebar-header span { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
.count-badge { background: var(--accent); color: white; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 600; }
.tree { overflow-y: auto; flex: 1; padding: 6px 0; }
.tree::-webkit-scrollbar { width: 3px; }
.tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.unit-header {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 14px; cursor: pointer; user-select: none;
  transition: background 0.15s;
}
.unit-header:hover { background: var(--surface2); }
.unit-header.open .chevron { transform: rotate(90deg); }
.chevron { color: var(--text-muted); font-size: 9px; transition: transform 0.2s; flex-shrink: 0; }
.unit-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.unit-label { font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.7px; flex: 1; line-height: 1.3; }
.unit-count { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); }
.apps-list { display: none; padding-bottom: 2px; }
.apps-list.open { display: block; }
.app-item {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 14px 6px 33px; cursor: pointer;
  transition: background 0.15s;
  border-left: 2px solid transparent;
}
.app-item:hover { background: var(--surface2); }
.app-item.active { background: rgba(124,58,237,0.1); border-left-color: var(--accent); }
.app-item.active { background-color: var(--accent-glow); }
.app-name { font-size: 11px; color: var(--text-dim); line-height: 1.3; flex: 1; }
.app-item.active .app-name { color: var(--text); }
.app-file { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ═══════════════════════════════════════════════════
   İÇERİK ALANI
═══════════════════════════════════════════════════ */
.content { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); transition: background 0.3s; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 14px; color: var(--text-muted);
}
.empty-icon { font-size: 44px; opacity: 0.3; }
.empty-state h2 { font-size: 17px; color: var(--text-dim); font-weight: 600; }
.empty-state p { font-size: 12px; font-family: 'JetBrains Mono', monospace; text-align: center; line-height: 1.6; }

.search-results { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding: 22px 28px; }
.search-results.visible { display: flex; }
.search-result-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 15px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; margin-bottom: 7px; transition: all 0.15s;
}
.search-result-item:hover { border-color: var(--accent); background: var(--accent-glow); }
.sr-unit { font-size: 9px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.sr-name { font-size: 13px; font-weight: 600; }
.sr-file { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent2); }

.app-detail { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding: 28px 32px; }
.app-detail.visible { display: flex; }
.app-detail::-webkit-scrollbar { width: 3px; }
.app-detail::-webkit-scrollbar-thumb { background: var(--border); }

.breadcrumb { display: flex; align-items: center; gap: 7px; margin-bottom: 24px; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
.breadcrumb span { color: var(--text-muted); }
.breadcrumb .sep { color: var(--border); }
.breadcrumb .current { color: var(--accent2); }

.app-title-row { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 10px; }
.app-title-icon { width: 48px; height: 48px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; box-shadow: 0 0 24px var(--accent-glow); }
.app-title h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.2; }
.file-tag { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent2); }
.unit-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 22px; }
.unit-chip-dot { width: 6px; height: 6px; border-radius: 50%; }
.section-title { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 12px; padding-bottom: 7px; border-bottom: 1px solid var(--border); }

.buttons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 12px; margin-bottom: 26px; }
.action-btn {
  display: flex; flex-direction: column; gap: 9px; padding: 17px;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; text-decoration: none;
  transition: all 0.2s; position: relative; overflow: hidden;
}
.action-btn::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0; transition: opacity 0.2s; }
.action-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.action-btn:hover::before { opacity: 1; }
.btn-run::before { background: radial-gradient(circle at top left, rgba(34,197,94,0.12), transparent 70%); }
.btn-run:hover { border-color: var(--green); }
.btn-question::before { background: radial-gradient(circle at top left, rgba(59,130,246,0.12), transparent 70%); }
.btn-question:hover { border-color: var(--blue); }
.btn-pdf::before { background: radial-gradient(circle at top left, rgba(239,68,68,0.12), transparent 70%); }
.btn-pdf:hover { border-color: var(--red); }
.btn-docx::before { background: radial-gradient(circle at top left, rgba(59,130,246,0.12), transparent 70%); }
.btn-docx:hover { border-color: var(--blue); }
.btn-rar::before { background: radial-gradient(circle at top left, rgba(249,115,22,0.12), transparent 70%); }
.btn-rar:hover { border-color: var(--orange); }
.btn-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.btn-run .btn-icon { background: rgba(34,197,94,0.15); }
.btn-question .btn-icon { background: rgba(59,130,246,0.15); }
.btn-pdf .btn-icon { background: rgba(239,68,68,0.15); }
.btn-docx .btn-icon { background: rgba(59,130,246,0.15); }
.btn-rar .btn-icon { background: rgba(249,115,22,0.15); }
.btn-title { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.2; }
.btn-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); margin-top: 2px; }
.btn-ext { font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 700; align-self: flex-start; }
.btn-run .btn-ext { background: rgba(34,197,94,0.15); color: var(--green); }
.btn-question .btn-ext { background: rgba(59,130,246,0.15); color: var(--blue); }
.btn-pdf .btn-ext { background: rgba(239,68,68,0.15); color: var(--red); }
.btn-docx .btn-ext { background: rgba(59,130,246,0.15); color: var(--blue); }
.btn-rar .btn-ext { background: rgba(249,115,22,0.15); color: var(--orange); }

.url-preview { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 16px 18px; }
.url-row { display: flex; align-items: center; gap: 9px; padding: 5px 0; border-bottom: 1px solid var(--border); }
.url-row:last-child { border-bottom: none; }
.url-ext { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; width: 40px; flex-shrink: 0; }
.url-path { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.url-copy { background: none; border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 9px; cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
.url-copy:hover { border-color: var(--accent); color: var(--accent2); }

/* ═══════════════════════════════════════════════════
   MOBİL RESPONSIVE
═══════════════════════════════════════════════════ */
@media (max-width: 768px) {
  body { overflow: hidden; }

  header { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
  .header-text h1 { font-size: 14px; }
  .header-text p { display: none; }
  .header-right { width: 100%; gap: 6px; }
  .search-wrap { flex: 1; }
  .search-wrap input { width: 100%; font-size: 13px; padding: 8px 12px 8px 30px; }
  .gh-link { padding: 7px 9px; }
  .theme-btn { padding: 7px 8px; }
  #themeBtnLabel { display: none; }
  .theme-dropdown { right: 0; }

  /* Ana layout tek sütun */
  .main { grid-template-columns: 1fr; position: relative; height: calc(100vh - 88px); }

  /* Sidebar overlay panel */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 82vw; max-width: 300px;
    z-index: 500;
    transform: translateX(-100%);
    transition: transform 0.28s ease;
    box-shadow: 6px 0 24px rgba(0,0,0,0.25);
  }
  .sidebar.mob-open { transform: translateX(0); }

  .mob-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 499;
    display: none;
  }
  .mob-overlay.visible { display: block; }

  /* İçerik tam ekran */
  .content { width: 100%; height: 100%; overflow-y: auto; }

  /* App detail */
  .app-detail { padding: 16px 14px; }

  /* Butonlar tek sütun, yatay */
  .buttons-grid { grid-template-columns: 1fr; gap: 9px; margin-bottom: 18px; }
  .action-btn {
    flex-direction: row;
    align-items: center;
    gap: 14px;
    padding: 13px 15px;
    border-radius: 12px;
  }
  .action-btn::before { display: none; }
  .btn-icon { flex-shrink: 0; }
  .btn-ext { margin-left: auto; flex-shrink: 0; }

  .app-title h2 { font-size: 17px; }
  .app-title-icon { width: 42px; height: 42px; font-size: 18px; }
  .breadcrumb { font-size: 9px; margin-bottom: 12px; }
  .unit-chip { font-size: 9px; margin-bottom: 16px; }

  /* URL önizleme gizle */
  .url-preview { display: none; }

  /* Sidebar'da kapat butonu */
  .sidebar-close-row {
    display: flex; justify-content: flex-end;
    padding: 10px 12px 4px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-close-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 7px; color: var(--text-muted);
    padding: 5px 12px; font-size: 12px; cursor: pointer;
    font-family: 'Syne', sans-serif;
  }

  /* Menü aç butonu header'da */
  .mob-menu-btn {
    display: flex; align-items: center; gap: 5px;
    background: var(--accent); color: white;
    border: none; border-radius: 8px;
    padding: 8px 12px;
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 700; cursor: pointer;
    flex-shrink: 0;
  }

  .search-results { padding: 14px 12px; }
  .empty-state h2 { font-size: 15px; }
  .empty-state p { font-size: 11px; }
}

@media (min-width: 769px) {
  .mob-menu-btn { display: none; }
  .mob-overlay { display: none !important; }
  .sidebar-close-row { display: none; }
}
</style>
</head>
<body>

<!-- MOBİL OVERLAY -->
<div class="mob-overlay" id="mobOverlay" onclick="closeSidebar()"></div>

<header>
  <button class="mob-menu-btn" onclick="openSidebar()">☰ Konular</button>
  <div class="logo">C#</div>
  <div class="header-text">
    <h1>C# Uygulamaları</h1>
    <p>Mustafaatakum / ntp</p>
  </div>
  <div class="header-right">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Uygulama ara..." oninput="handleSearch(this.value)">
    </div>

    <!-- TEMA SEÇİCİ -->
    <div class="theme-selector">
      <button class="theme-btn" onclick="toggleThemeDropdown()" id="themeBtn">
        🎨 <span id="themeBtnLabel">Tema</span> ▾
      </button>
      <div class="theme-dropdown" id="themeDropdown">
        <div class="theme-option" onclick="setTheme('dark')" data-theme="dark">
          <div class="theme-dot" style="background:#7c3aed"></div> Koyu (Varsayılan)
        </div>
        <div class="theme-option" onclick="setTheme('light')" data-theme="light">
          <div class="theme-dot" style="background:#ddd;border-color:#999"></div> Açık
        </div>
        <div class="theme-option" onclick="setTheme('blue')" data-theme="blue">
          <div class="theme-dot" style="background:#3b82f6"></div> Mavi / Okyanus
        </div>
        <div class="theme-option" onclick="setTheme('green')" data-theme="green">
          <div class="theme-dot" style="background:#16a34a"></div> Yeşil / Orman
        </div>

// TEMA SİSTEMİ
// ════════════════════════════════════════════════════════
const TEMA_ISIMLER = {
  dark: 'Koyu',
  light: 'Açık',
  blue: 'Mavi',
  green: 'Yeşil',
  warm: 'Sıcak'
};

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme === 'dark' ? '' : theme);
  if (theme === 'dark') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  
  localStorage.setItem('ntp_theme', theme);
  document.getElementById('themeBtnLabel').textContent = TEMA_ISIMLER[theme];
  
  // Aktif işareti güncelle
  document.querySelectorAll('.theme-option').forEach(el => {
    el.classList.toggle('active', el.dataset.theme === theme);
  });
  
  closeThemeDropdown();
}

function toggleThemeDropdown() {
  document.getElementById('themeDropdown').classList.toggle('open');
}

function closeThemeDropdown() {
  document.getElementById('themeDropdown').classList.remove('open');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.theme-selector')) closeThemeDropdown();
});

// Sayfa yüklenince kayıtlı temayı uygula
(function() {
  const saved = localStorage.getItem('ntp_theme') || 'light';
  setTheme(saved);
})();

// AĞAÇ RENDER
// ════════════════════════════════════════════════════════
let selectedApp = null;
let openUnits = new Set();

function getUrl(file, ext) { return GITHUB_BASE + file + "." + ext; }

function renderTree() {
  const tree = document.getElementById('tree');
  let total = 0; UNITS.forEach(u => total += u.apps.length);
  document.getElementById('totalCount').textContent = total;
  tree.innerHTML = UNITS.map((unit, ui) => {
    const isOpen = openUnits.has(ui);
    return `<div>
      <div class="unit-header ${isOpen?'open':''}" onclick="toggleUnit(${ui})">
        <span class="chevron">▶</span>
        <span class="unit-dot" style="background:${unit.color}"></span>
        <span class="unit-label">${unit.name}</span>
        <span class="unit-count">${unit.apps.length}</span>
      </div>
      <div class="apps-list ${isOpen?'open':''}" id="unit-${ui}">
        ${unit.apps.map((app,ai) => `
          <div class="app-item ${selectedApp&&selectedApp.ui===ui&&selectedApp.ai===ai?'active':''}" onclick="selectApp(${ui},${ai})">
            <span class="app-name">${app.name}</span>
            <span class="app-file">${app.file}</span>
          </div>`).join('')}
      </div></div>`;
  }).join('');
}

function toggleUnit(ui) {
  if (openUnits.has(ui)) openUnits.delete(ui); else openUnits.add(ui);
  renderTree();
}

function selectApp(ui, ai) {
  selectedApp = {ui, ai};
  openUnits.add(ui);
  document.getElementById('searchInput').value = '';
  showDetail();
  renderTree();
}

function showDetail() {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('searchResults').classList.remove('visible');
  document.getElementById('appDetail').classList.add('visible');
  const unit = UNITS[selectedApp.ui], app = unit.apps[selectedApp.ai], file = app.file;
  const btns = [
    {ext:'exe',label:'Programı Çalıştır',sub:'.exe — çalışır dosya',cls:'btn-run',icon:'▶️'},
    {ext:'pdf',label:'Kodları Görüntüle',sub:'.pdf — kaynak kodlar',cls:'btn-pdf',icon:'📄'},
    {ext:'docx',label:'Kodları İndir',sub:'.docx — Word belgesi',cls:'btn-docx',icon:'📝'},
    {ext:'rar',label:'Projeyi İndir',sub:'.rar — .cs .sln .csproj',cls:'btn-rar',icon:'📦'},
    {ext:'txt',label:'Soruyu Gör',sub:'.txt — soru dosyası',cls:'btn-question',icon:'❓'},
  ];
  const extColor = {exe:'var(--green)',pdf:'var(--red)',docx:'var(--blue)',rar:'var(--orange)',txt:'var(--blue)'};
  document.getElementById('appDetail').innerHTML = `
    <div class="breadcrumb"><span>NTP</span><span class="sep">/</span><span>${unit.name}</span><span class="sep">/</span><span class="current">${app.name}</span></div>
    <div class="app-title-row">
      <div class="app-title-icon" style="background:${unit.color}">${unit.icon}</div>
      <div class="app-title"><h2>${app.name}</h2><div class="file-tag">📁 ${file}</div></div>
    </div>
    <div class="unit-chip" style="background:${unit.color}22;border:1px solid ${unit.color}44;color:${unit.color}">
      <span class="unit-chip-dot" style="background:${unit.color}"></span>${unit.name}
    </div>
    <div class="section-title">DOSYALARA ERİŞ</div>
    <div class="buttons-grid">
      ${btns.map(b=>`<a class="action-btn ${b.cls}" href="${getUrl(file,b.ext)}" target="_blank" download>
        <div class="btn-icon">${b.icon}</div>
        <div><div class="btn-title">${b.label}</div><div class="btn-sub">${b.sub}</div></div>
        <span class="btn-ext">.${b.ext.toUpperCase()}</span></a>`).join('')}
    </div>
    <div class="section-title" style="margin-top:4px">URL ÖNİZLEME</div>
    <div class="url-preview">
      ${btns.map(b=>`<div class="url-row">
        <span class="url-ext" style="color:${extColor[b.ext]}">.${b.ext}</span>
        <span class="url-path">${getUrl(file,b.ext)}</span>
        <button class="url-copy" onclick="copyUrl('${getUrl(file,b.ext)}',this)">kopyala</button>
      </div>`).join('')}
    </div>`;
}

function copyUrl(url, btn) {
  navigator.clipboard.writeText(url).then(() => { btn.textContent = '✓'; setTimeout(() => btn.textContent = 'kopyala', 1500); });
}

function handleSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) {
    document.getElementById('searchResults').classList.remove('visible');
    if (selectedApp) showDetail();
    else { document.getElementById('emptyState').style.display='flex'; document.getElementById('appDetail').classList.remove('visible'); }
    return;
  }
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('appDetail').classList.remove('visible');
  const sr = document.getElementById('searchResults');
  sr.classList.add('visible');
  let res = [];
  UNITS.forEach((unit, ui) => unit.apps.forEach((app, ai) => {
    if (app.name.toLowerCase().includes(q) || app.file.toLowerCase().includes(q)) res.push({unit,ui,app,ai});
  }));
  if (!res.length) { sr.innerHTML = `<div style="color:var(--text-muted);font-family:'JetBrains Mono';font-size:13px;padding:40px;text-align:center;">"${q}" için sonuç bulunamadı</div>`; return; }
  sr.innerHTML = `<div style="font-family:'JetBrains Mono';font-size:11px;color:var(--text-muted);margin-bottom:14px;">${res.length} sonuç</div>` +
    res.map(r=>`<div class="search-result-item" onclick="selectApp(${r.ui},${r.ai})">
      <div class="unit-dot" style="background:${r.unit.color};width:10px;height:10px;border-radius:3px;flex-shrink:0"></div>
      <div style="flex:1"><div class="sr-unit">${r.unit.name}</div><div class="sr-name">${r.app.name}</div><div class="sr-file">${r.app.file}</div></div>
      <span style="color:var(--text-muted);font-size:18px">›</span></div>`).join('');
}

renderTree();

// ══════════════════════════════════════
// MOBİL SIDEBAR
// ══════════════════════════════════════
function openSidebar() {
  document.getElementById('sidebar').classList.add('mob-open');
  document.getElementById('mobOverlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mob-open');
  document.getElementById('mobOverlay').classList.remove('visible');
  document.body.style.overflow = '';
}

// Uygulama seçince mobil sidebar kapansın
const _orig = selectApp;
selectApp = function(ui, ai) {
  _orig(ui, ai);
  if (window.innerWidth <= 768) closeSidebar();
};
</script>
